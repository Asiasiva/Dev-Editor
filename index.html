<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Edtr</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base styles (Light Theme Defaults) */
        :root {
            --editor-bg: #1e1e1e;
            --editor-fg: #d4d4d4;
            --line-num-bg: #2d2d2d;
            --line-num-fg: #858585;
            --main-bg: #eff6ff; /* Blue-50 */
            --header-bg: #ffffff;
            --header-text: #2563eb;
            --border-color: #bfdbfe; /* Blue-200 */
        }

        /* Dark Theme Overrides */
        body.dark-mode {
            --main-bg: #111827; /* Gray-900 */
            --header-bg: #1f2937; /* Gray-800 */
            --header-text: #93c5fd; /* Blue-300 */
            --border-color: #374151; /* Gray-700 */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--main-bg);
            transition: background-color 0.3s;
        }

        /* Split layout logic */
        .main-split {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 1rem;
        }

        @media (min-width: 1024px) {
            .main-split {
                flex-direction: row;
            }
        }

        /* Editor Styles */
        .editor-container {
            display: flex;
            height: 100%;
            background-color: var(--editor-bg);
            position: relative;
        }

        .line-numbers {
            width: 3rem;
            height: 100%;
            background-color: var(--line-num-bg);
            color: var(--line-num-fg);
            text-align: right;
            padding: 1rem 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            line-height: 1.5;
            overflow: hidden; 
            user-select: none;
            border-right: 1px solid #404040;
        }

        .code-input {
            flex: 1;
            height: 100%;
            padding: 1rem;
            border: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            line-height: 1.5;
            outline: none;
            background-color: var(--editor-bg);
            color: var(--editor-fg);
            white-space: pre; 
            overflow: auto;
        }
        
        /* Console Styles */
        #console-output-wrapper {
            transition: height 0.3s ease;
            overflow: hidden; 
        }
        #console-output {
            background-color: #000;
            color: #ccc;
            height: 150px; 
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            padding: 5px;
        }

        /* Console log types */
        .console-log { color: #ccc; }
        .console-error { color: #f87171; font-weight: bold; } 
        .console-warn { color: #fcd34d; } 
        
        /* Output frame wrapper for centering */
        .output-wrapper {
            background-color: var(--main-bg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            width: 100%;
            flex: 1; 
            padding-top: 0;
        }

        /* Output frame itself */
        #output-frame {
            border: none;
            background-color: white;
            transition: width 0.3s ease, height 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Full-Screen Mode */
        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            padding: 0;
            background-color: white; 
            margin: 0 !important;
            border-radius: 0 !important;
        }

        .hidden-editor {
            display: none !important;
        }
        
        /* Device Button Active State */
        .device-btn.active {
            background-color: #bfdbfe; 
            color: #1e40af; 
        }

        /* Scrollbar customization */
        textarea::-webkit-scrollbar, #console-output::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        textarea::-webkit-scrollbar-track { background: #1e1e1e; }
        textarea::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 5px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        
        /* Dark mode colors for general elements */
        .dark-mode .header { background-color: var(--header-bg); border-color: var(--border-color); }
        .dark-mode .header h1 { color: var(--header-text); }
        .dark-mode .output-panel-container { background-color: var(--header-bg); border-color: var(--border-color); }
        .dark-mode .output-bar { background-color: #1f2937; border-color: #374151; }
        .dark-mode .output-wrapper { background-color: #111827; }
        .dark-mode .download-btn { background-color: #3b82f6; border-color: #3b82f6; }
        .dark-mode .reset-btn { background-color: #1f2937; border-color: #60a5fa; color: #f87171; }
        .dark-mode .reset-btn:hover { background-color: #374151; }
        
        /* Hidden console state */
        .console-hidden {
            height: 0px !important;
            padding: 0 !important;
            border: none !important;
        }

        /* Range Selector Styling with Dark Theme support */
        .range-selector-panel {
            background-color: #f0f7ff;
            border-top: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }
        .dark-mode .range-selector-panel {
            background-color: #1f2937;
            border-color: #374151;
        }
        .dark-mode .range-text-title {
            color: #93c5fd;
        }
        .dark-mode .range-text-muted {
            color: #9ca3af;
        }
        .dark-mode .range-input-num {
            background-color: #111827;
            color: #d4d4d4;
            border-color: #4b5563;
        }
        #range-collapse-icon {
            transition: transform 0.2s ease;
        }
        .rotate-180 {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="h-screen flex flex-col p-2 md:p-4">

    <!-- Header and Controls -->
    <div class="flex-none header bg-white p-3 rounded-xl shadow-md border border-blue-100 mb-3 flex flex-col md:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-extrabold text-blue-600"><i class="fa-solid fa-code"></i> Dev Edtr</h1>
            <!-- Database Connection Status -->
            <span id="db-status" class="text-xs font-semibold px-2 py-1 rounded-full bg-red-100 text-red-600">
                <i class="fa-solid fa-database mr-1"></i> Database Connecting...
            </span>
        </div>

        <div class="flex flex-wrap justify-center gap-2">
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme();" id="theme-toggle-btn" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-medium rounded-lg shadow-sm transition" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button onclick="downloadCode();" class="download-btn px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg shadow-sm transition" title="Download">
                <i class="fa-solid fa-download mr-1"></i> பதிவிறக்கம்
            </button>
            <button onclick="clearCode();" class="reset-btn px-4 py-2 bg-white border border-blue-200 text-red-500 hover:bg-red-50 hover:text-red-600 text-sm font-medium rounded-lg shadow-sm transition" title="Reset Instantly">
                <i class="fa-solid fa-trash mr-1"></i> மீட்டமை
            </button>
        </div>
    </div>

    <!-- Main Split Area -->
    <div class="main-split flex-1 min-h-0">
        
        <!-- 1. HTML Editor Panel -->
        <div class="html-editor-panel flex-1 flex flex-col rounded-xl overflow-hidden shadow-xl border border-blue-200 relative">
            <div class="bg-blue-800 text-white px-4 py-2 text-xs flex justify-between items-center select-none flex-none">
                <span class="font-bold tracking-wider"><i class="fa-solid fa-code mr-2"></i>HTML SOURCE</span>
                <span id="char-count" class="text-blue-200">0 chars</span>
            </div>
            
            <!-- Editor Container with Line Numbers -->
            <div class="editor-container flex-1 overflow-hidden">
                <div id="line-numbers" class="line-numbers">1</div>
                <textarea id="html-code" class="code-input" placeholder="<!-- உங்கள் HTML, CSS மற்றும் JavaScript கோடை இங்கே டைப் செய்யவும்... -->" spellcheck="false"></textarea>
            </div>

            <!-- Range Selector Control Section -->
            <div class="range-selector-panel flex-none">
                <button onclick="toggleRangeSelector()" class="w-full flex justify-between items-center px-4 py-2.5 text-xs font-bold text-blue-700 dark:text-blue-300 hover:bg-blue-100/30 dark:hover:bg-gray-700/30 transition select-none">
                    <span class="flex items-center gap-2 range-text-title">
                        <i class="fa-solid fa-sliders text-blue-500"></i>
                        <span>RANGE SELECTOR (வரிசை வரம்பு தேர்வி)</span>
                    </span>
                    <div class="flex items-center gap-2">
                        <span id="range-badge" class="bg-blue-200 text-blue-800 px-2 py-0.5 rounded text-[10px] font-semibold dark:bg-blue-900 dark:text-blue-200">Lines: 1 - 1</span>
                        <i id="range-collapse-icon" class="fa-solid fa-chevron-up text-blue-500"></i>
                    </div>
                </button>
                <div id="range-selector-content" class="px-4 pb-3 pt-1 border-t border-blue-100 dark:border-gray-700/50 grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                    <!-- Sliders -->
                    <div class="md:col-span-7 space-y-2">
                        <div class="flex items-center gap-4">
                            <div class="flex-1 flex items-center gap-2">
                                <span class="text-xs text-gray-500 range-text-muted w-10">Start:</span>
                                <input type="range" id="range-start-slider" min="1" max="1" value="1" class="w-full accent-blue-600 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg cursor-pointer">
                                <input type="number" id="range-start-val" min="1" max="1" value="1" class="range-input-num w-12 text-center text-xs p-1 border border-blue-200 rounded bg-white text-gray-800">
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex-1 flex items-center gap-2">
                                <span class="text-xs text-gray-500 range-text-muted w-10">End:</span>
                                <input type="range" id="range-end-slider" min="1" max="1" value="1" class="w-full accent-blue-600 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg cursor-pointer">
                                <input type="number" id="range-end-val" min="1" max="1" value="1" class="range-input-num w-12 text-center text-xs p-1 border border-blue-200 rounded bg-white text-gray-800">
                            </div>
                        </div>
                    </div>
                    <!-- Stats & Actions -->
                    <div class="md:col-span-5 flex flex-wrap gap-2 justify-end">
                        <div class="text-[11px] text-gray-500 range-text-muted w-full flex justify-between border-b border-blue-100 dark:border-gray-700/50 pb-1 mb-1">
                            <span>Selected: <strong id="range-chars-count" class="text-blue-600 dark:text-blue-400">0</strong> chars</span>
                            <span>Lines: <strong id="range-lines-count" class="text-blue-600 dark:text-blue-400">1</strong></span>
                        </div>
                        <button onclick="rangeActionSelect()" class="px-2.5 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded text-xs transition font-semibold flex items-center gap-1 dark:bg-blue-900/50 dark:hover:bg-blue-900/80 dark:text-blue-300">
                            <i class="fa-solid fa-arrow-pointer"></i> Highlight
                        </button>
                        <button onclick="rangeActionCopy()" class="px-2.5 py-1.5 bg-green-100 hover:bg-green-200 text-green-700 rounded text-xs transition font-semibold flex items-center gap-1 dark:bg-green-950/50 dark:hover:bg-green-950 dark:text-green-300">
                            <i class="fa-solid fa-copy"></i> Copy
                        </button>
                        <button onclick="rangeActionCut()" class="px-2.5 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded text-xs transition font-semibold flex items-center gap-1 dark:bg-rose-950/50 dark:hover:bg-rose-950 dark:text-rose-300" title="Cut selected line range">
                            <i class="fa-solid fa-scissors"></i> Cut
                        </button>
                        <button onclick="rangeActionComment()" class="px-2.5 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded text-xs transition font-semibold flex items-center gap-1 dark:bg-purple-950/50 dark:hover:bg-purple-950 dark:text-purple-300">
                            <i class="fa-solid fa-comment-slash"></i> Comment
                        </button>
                        <button onclick="rangeActionExtract()" class="px-2.5 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded text-xs transition font-semibold flex items-center gap-1 dark:bg-amber-950/50 dark:hover:bg-amber-950 dark:text-amber-300" title="Keep only selected range">
                            <i class="fa-solid fa-crop"></i> Crop
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. Live Output Panel (Split into Output and Console) -->
        <div class="output-panel-container flex-1 flex flex-col rounded-xl overflow-hidden shadow-xl border border-blue-200 bg-white">
            <div class="flex justify-between items-center output-bar bg-blue-50 border-b border-blue-100 px-3 py-2 flex-none">
                <!-- Mac-style Dots -->
                <div class="flex items-center gap-1.5 hidden sm:flex">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                </div>

                <!-- Device Toggles -->
                <div class="flex bg-white border border-blue-100 rounded-lg p-1 gap-1 mx-auto shadow-sm">
                    <button onclick="setDevice('mobile')" class="device-btn px-2 py-1 rounded text-gray-500 hover:bg-blue-50 transition" title="Mobile (375px)">
                        <i class="fa-solid fa-mobile-screen"></i>
                    </button>
                    <button onclick="setDevice('desktop')" class="device-btn active px-2 py-1 rounded text-gray-500 hover:bg-blue-50 transition" title="Desktop (100%)">
                        <i class="fa-solid fa-desktop"></i>
                    </button>
                </div>

                <!-- Right Side Actions -->
                <div class="flex items-center gap-2">
                    <button onclick="openNewTab()" class="text-blue-400 hover:text-blue-700 px-2 py-1 transition" title="Open in New Tab">
                        <i class="fa-solid fa-external-link-alt"></i>
                    </button>
                    <button id="fullscreen-btn" onclick="toggleFullscreen();" class="text-blue-400 hover:text-blue-700 px-2 py-1 transition" title="Toggle Fullscreen">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
            
            <!-- Iframe Output Area -->
            <div class="output-wrapper">
                <iframe id="output-frame" class="w-full h-full"></iframe>
            </div>

            <!-- Console Bar -->
            <div class="flex-none bg-gray-900 text-white p-1 flex justify-between items-center text-xs border-t border-blue-200">
                <span class="font-bold ml-1">CONSOLE OUTPUT</span>
                <div class="flex items-center space-x-2">
                    <button onclick="clearConsole()" class="text-xs text-gray-400 hover:text-white px-1 py-0.5 transition" title="Clear Console">
                        <i class="fa-solid fa-xmark mr-1"></i> Clear
                    </button>
                    <!-- Console Hide Button -->
                    <button onclick="toggleConsolePanel()" id="console-toggle-btn" class="text-xs text-gray-400 hover:text-white px-1 py-0.5 transition" title="Hide/Show Console">
                        <i class="fa-solid fa-angle-down"></i>
                    </button>
                </div>
            </div>
            <!-- Console Output Panel -->
            <div id="console-output-wrapper" class="flex-none h-[150px]">
                <pre id="console-output" class="h-full"></pre>
            </div>
        </div>

    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-blue-900 text-white px-4 py-2 rounded shadow-lg transform translate-y-20 opacity-0 transition-all duration-300">
        செயல் வெற்றிகரமாக முடிந்தது!
    </div>

    <script type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Variables
        let db;
        let auth;
        let isAuthReady = false;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // --- DOM Elements ---
        const htmlCode = document.getElementById('html-code');
        const lineNumbers = document.getElementById('line-numbers');
        const outputFrame = document.getElementById('output-frame');
        const consoleOutput = document.getElementById('console-output');
        const consoleOutputWrapper = document.getElementById('console-output-wrapper');
        const consoleToggleButton = document.getElementById('console-toggle-btn');
        const editorPanel = document.querySelector('.html-editor-panel');
        const outputPanel = document.querySelector('.output-panel-container');
        const fullscreenButton = document.getElementById('fullscreen-btn');
        const charCount = document.getElementById('char-count');
        const toast = document.getElementById('toast');
        const deviceBtns = document.querySelectorAll('.device-btn');
        const body = document.body;
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const dbStatus = document.getElementById('db-status');


        // Default skeleton code for reset/init
        const defaultSkeleton = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"><\/script>
    <title>Dev Edtr Project</title>
</head>
<body class="p-8 bg-gray-100 text-gray-800">
    <div class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-blue-600">Database Ready!</h1>
        <p class="mt-2 text-sm">Firebase இணைப்பு இப்போது தயார். (Console-ஐ பார்க்கவும்)</p>
        <button id="testBtn" class="mt-4 bg-green-500 hover:bg-green-600 text-white p-2 rounded">Console Log</button>
    </div>

    <script>
        document.getElementById('testBtn').addEventListener('click', () => {
            console.log("பட்டன் கிளிக் செய்யப்பட்டது.");
            console.warn("இந்த இணைப்பு உள்ளூர் சர்வர் மூலம் இயங்கினால் மட்டுமே Database இணைப்பு வேலை செய்யும்.");
        });
    <\/script>
</body>
</html>`;

        // Debounce Logic
        let debounceTimer;
        const DEBOUNCE_DELAY = 10; // Instant execution

        // --- FIREBASE INITIALIZATION ---

        async function initFirebase() {
            if (!firebaseConfig) {
                dbStatus.textContent = 'Database Disabled (No Config)';
                dbStatus.classList.replace('bg-red-100', 'bg-gray-100');
                dbStatus.classList.replace('text-red-600', 'text-gray-600');
                return;
            }
            
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // setLogLevel('Debug'); // Enable this for verbose debugging

                // Sign in logic
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => {
                    isAuthReady = true;
                    if (user) {
                        dbStatus.textContent = 'Database Connected';
                        dbStatus.classList.replace('bg-red-100', 'bg-green-100');
                        dbStatus.classList.replace('text-red-600', 'text-green-600');
                        console.log("Firebase: Anonymous user signed in successfully.");
                    } else {
                        dbStatus.textContent = 'Database Disconnected';
                        dbStatus.classList.replace('bg-red-100', 'bg-red-100');
                        dbStatus.classList.replace('text-red-600', 'text-red-600');
                    }
                    loadCode(); // Load code only after auth is confirmed
                    updateOutput();
                    setDevice('desktop'); // Final setup after everything is loaded
                });

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                dbStatus.textContent = 'Database Error';
                dbStatus.classList.replace('bg-red-100', 'bg-red-100');
                dbStatus.classList.replace('text-red-600', 'text-red-600');
                loadCode();
                updateOutput();
                setDevice('desktop');
            }
        }


        // --- THEME TOGGLE LOGIC ---
        window.toggleTheme = function() {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('editorTheme', isDark ? 'dark' : 'light');
            themeToggleBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('editorTheme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }


        // --- CONSOLE LOGIC ---

        window.clearConsole = function() {
            consoleOutput.innerHTML = '';
            showToast("Console Clear ஆனது.");
        }

        window.toggleConsolePanel = function() {
            const isHidden = consoleOutputWrapper.classList.toggle('console-hidden');
            consoleToggleButton.innerHTML = isHidden ? '<i class="fa-solid fa-angle-up"></i>' : '<i class="fa-solid fa-angle-down"></i>';
            showToast(isHidden ? "Console மறைக்கப்பட்டது" : "Console தோன்றியது");
        }


        function hijackConsole(iframe) {
            if (!iframe.contentWindow) return;

            const consoleMethods = ['log', 'warn', 'error'];
            
            consoleOutput.innerHTML = ''; 

            consoleMethods.forEach(method => {
                iframe.contentWindow.console[method] = (...args) => {
                    const message = args.map(arg => {
                        if (typeof arg === 'object' && arg !== null) {
                            try {
                                return JSON.stringify(arg);
                            } catch (e) {
                                return String(arg); 
                            }
                        }
                        return String(arg);
                    }).join(' ');

                    const typeClass = `console-${method}`;
                    const line = document.createElement('div');
                    line.className = typeClass;
                    line.textContent = `[${method.toUpperCase()}] ${message}`;
                    consoleOutput.appendChild(line);
                    
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                    
                    console[method](...args);
                };
            });
            
            // Capture runtime errors
            iframe.contentWindow.onerror = (message, source, lineno, colno, error) => {
                const line = document.createElement('div');
                line.className = 'console-error';
                line.textContent = `[RUNTIME ERROR] ${message} (Line: ${lineno})`;
                consoleOutput.appendChild(line);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
                return true; 
            };
        }


        // --- Line Number Logic ---
        function updateLineNumbers() {
            const lines = htmlCode.value.split('\n').length;
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
            updateRangeLimits(lines);
        }

        function syncScroll() {
            lineNumbers.scrollTop = htmlCode.scrollTop;
        }

        // --- EDITOR FUNCTIONS ---

        window.setDevice = function(mode) {
            deviceBtns.forEach(btn => btn.classList.remove('active'));

            if (mode === 'mobile') {
                outputFrame.style.width = '375px';
                outputFrame.style.height = '667px';
                outputFrame.style.marginTop = '20px';
                outputFrame.style.borderRadius = '20px';
                outputFrame.style.border = '8px solid #333';
                deviceBtns[0].classList.add('active');
            } else if (mode === 'desktop') {
                outputFrame.style.width = '100%';
                outputFrame.style.height = '100%';
                outputFrame.style.marginTop = '0';
                outputFrame.style.borderRadius = '0';
                outputFrame.style.border = 'none';
                deviceBtns[1].classList.add('active'); 
            }
        }

        window.openNewTab = function() {
            const htmlContent = htmlCode.value;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        window.toggleFullscreen = function() {
            const isFullscreen = outputPanel.classList.toggle('fullscreen-mode');
            editorPanel.classList.toggle('hidden-editor');

            if (isFullscreen) {
                fullscreenButton.innerHTML = '<i class="fa-solid fa-compress"></i>';
            } else {
                fullscreenButton.innerHTML = '<i class="fa-solid fa-expand"></i>';
            }
        }

        function updateOutput() {
            const html = htmlCode.value;
            charCount.textContent = `${html.length} chars`;
            updateLineNumbers(); 

            const finalOutput = html;
            
            // Write content to iframe
            outputFrame.contentWindow.document.open();
            outputFrame.contentWindow.document.write(finalOutput);
            outputFrame.contentWindow.document.close();

            // IMPORTANT: Hijack console AFTER content is loaded
            hijackConsole(outputFrame);
        }

        function saveCodeLocal() {
            try {
                localStorage.setItem('liveEditor_html_advanced', htmlCode.value);
            } catch (e) { console.warn("Local storage error:", e); }
        }

        function debouncedUpdate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                updateOutput();
                saveCodeLocal();
            }, DEBOUNCE_DELAY);
        }

        window.downloadCode = function() {
            const htmlContent = htmlCode.value;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("பதிவிறக்கம் ஆகிறது...");
        }

        window.clearCode = function() {
            if (outputPanel.classList.contains('fullscreen-mode')) {
                toggleFullscreen();
            }
            htmlCode.value = '';
            localStorage.removeItem('liveEditor_html_advanced');
            updateOutput(); 
            clearConsole();
            showToast("எடிட்டர் அழிக்கப்பட்டது");
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            if (isError) {
                toast.classList.add('bg-red-600');
                toast.classList.remove('bg-blue-900');
            } else {
                toast.classList.add('bg-blue-900');
                toast.classList.remove('bg-red-600');
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function loadCode() {
            // Load from Local Storage or use default
            try {
                const saved = localStorage.getItem('liveEditor_html_advanced');
                if (saved) {
                    htmlCode.value = saved;
                } else {
                    htmlCode.value = defaultSkeleton;
                }
            } catch (e) {
                console.warn("Load error", e);
                htmlCode.value = defaultSkeleton;
            }
        }

        // --- CODE RANGE SELECTOR LOGIC ---
        
        function getCharIndicesForLineRange(text, startLine, endLine) {
            const lines = text.split('\n');
            let startCharIndex = 0;
            let endCharIndex = 0;
            
            for (let i = 0; i < startLine - 1; i++) {
                if (i < lines.length) {
                    startCharIndex += lines[i].length + 1; // +1 to count the newline character
                }
            }
            
            endCharIndex = startCharIndex;
            for (let i = startLine - 1; i < endLine; i++) {
                if (i < lines.length) {
                    endCharIndex += lines[i].length + (i === lines.length - 1 ? 0 : 1);
                }
            }
            return { start: startCharIndex, end: endCharIndex };
        }

        function updateRangeLimits(totalLines) {
            const rStartSlider = document.getElementById('range-start-slider');
            const rEndSlider = document.getElementById('range-end-slider');
            const rStartVal = document.getElementById('range-start-val');
            const rEndVal = document.getElementById('range-end-val');
            
            if (!rStartSlider) return;
            
            const prevStart = parseInt(rStartSlider.value) || 1;
            const prevEnd = parseInt(rEndSlider.value) || 1;
            
            rStartSlider.max = totalLines;
            rEndSlider.max = totalLines;
            rStartVal.max = totalLines;
            rEndVal.max = totalLines;
            
            const nextStart = Math.min(prevStart, totalLines);
            const nextEnd = Math.min(prevEnd, totalLines);
            
            rStartSlider.value = nextStart;
            rStartVal.value = nextStart;
            rEndSlider.value = nextEnd;
            rEndVal.value = nextEnd;
            
            updateRangeStats();
        }

        function updateRangeStats() {
            const start = parseInt(document.getElementById('range-start-slider').value) || 1;
            const end = parseInt(document.getElementById('range-end-slider').value) || 1;
            
            const badge = document.getElementById('range-badge');
            if (badge) {
                badge.textContent = `Lines: ${start} - ${end}`;
            }
            
            const linesCount = document.getElementById('range-lines-count');
            if (linesCount) {
                linesCount.textContent = (end - start + 1);
            }
            
            const text = htmlCode.value;
            const { start: startIdx, end: endIdx } = getCharIndicesForLineRange(text, start, end);
            const selectedText = text.substring(startIdx, endIdx);
            
            const charsCount = document.getElementById('range-chars-count');
            if (charsCount) {
                charsCount.textContent = selectedText.length;
            }
        }

        window.toggleRangeSelector = function() {
            const content = document.getElementById('range-selector-content');
            const icon = document.getElementById('range-collapse-icon');
            const isHidden = content.classList.contains('hidden');
            
            if (isHidden) {
                content.classList.remove('hidden');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.add('rotate-180');
            }
        }

        window.rangeActionSelect = function() {
            const text = htmlCode.value;
            const start = parseInt(document.getElementById('range-start-slider').value) || 1;
            const end = parseInt(document.getElementById('range-end-slider').value) || 1;
            
            const { start: startIdx, end: endIdx } = getCharIndicesForLineRange(text, start, end);
            
            htmlCode.focus();
            htmlCode.setSelectionRange(startIdx, endIdx);
            
            // Try to scroll textarea to center/reveal the selection
            const lines = text.split('\n');
            const totalLines = lines.length;
            if (totalLines > 0) {
                const scrollRatio = (start - 1) / totalLines;
                htmlCode.scrollTop = htmlCode.scrollHeight * scrollRatio;
            }
            
            showToast("வரிசை வரம்பு தேர்ந்தெடுக்கப்பட்டது!");
        }

        window.rangeActionCopy = function() {
            const text = htmlCode.value;
            const start = parseInt(document.getElementById('range-start-slider').value) || 1;
            const end = parseInt(document.getElementById('range-end-slider').value) || 1;
            
            const lines = text.split('\n');
            const targetLines = lines.slice(start - 1, end);
            const rangeText = targetLines.join('\n');
            
            if (!rangeText.trim()) {
                showToast("வரம்பு காலியாக உள்ளது!", true);
                return;
            }

            // Fallback clipboard logic
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = rangeText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand("copy");
            document.body.removeChild(tempTextArea);
            
            showToast("வரிசை வரம்பு வெற்றிகரமாக நகலெடுக்கப்பட்டது!");
        }

        window.rangeActionCut = function() {
            const text = htmlCode.value;
            const start = parseInt(document.getElementById('range-start-slider').value) || 1;
            const end = parseInt(document.getElementById('range-end-slider').value) || 1;
            
            const lines = text.split('\n');
            const targetLines = lines.slice(start - 1, end);
            const rangeText = targetLines.join('\n');
            
            if (!rangeText.trim()) {
                showToast("வரம்பு காலியாக உள்ளது!", true);
                return;
            }

            // Copy range text to clipboard
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = rangeText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand("copy");
            document.body.removeChild(tempTextArea);

            // Remove selected lines from editor content
            lines.splice(start - 1, end - start + 1);
            htmlCode.value = lines.join('\n');
            
            updateOutput();
            saveCodeLocal();
            showToast("வரிசை வரம்பு வெற்றிகரமாக வெட்டப்பட்டது (Cut)!");
        }

        window.rangeActionComment = function() {
            const text = htmlCode.value;
            const start = parseInt(document.getElementById('range-start-slider').value) || 1;
            const end = parseInt(document.getElementById('range-end-slider').value) || 1;
            
            const lines = text.split('\n');
            const targetLines = lines.slice(start - 1, end);
            const joinedTarget = targetLines.join('\n');
            
            let resultText;
            const isCommented = joinedTarget.trim().startsWith('<!--') && joinedTarget.trim().endsWith('-->');
            
            if (isCommented) {
                let unwrapped = joinedTarget.trim();
                unwrapped = unwrapped.substring(4, unwrapped.length - 3).trim();
                lines.splice(start - 1, end - start + 1, unwrapped);
                resultText = lines.join('\n');
                showToast("கமெண்ட் நீக்கப்பட்டது!");
            } else {
                const wrapped = `<!-- \n${joinedTarget}\n -->`;
                lines.splice(start - 1, end - start + 1, wrapped);
                resultText = lines.join('\n');
                showToast("கமெண்ட் சேர்க்கப்பட்டது!");
            }
            
            htmlCode.value = resultText;
            updateOutput();
            saveCodeLocal();
        }

        window.rangeActionExtract = function() {
            const text = htmlCode.value;
            const start = parseInt(document.getElementById('range-start-slider').value) || 1;
            const end = parseInt(document.getElementById('range-end-slider').value) || 1;
            
            const lines = text.split('\n');
            const targetLines = lines.slice(start - 1, end);
            const rangeText = targetLines.join('\n');
            
            if (!rangeText.trim()) {
                showToast("தேர்ந்தெடுக்க வரம்பு காலியாக உள்ளது!", true);
                return;
            }
            
            htmlCode.value = rangeText;
            updateOutput();
            saveCodeLocal();
            showToast("தேர்ந்தெடுக்கப்பட்ட பகுதி மட்டும் வைக்கப்பட்டது!");
        }

        window.onload = () => {
            loadTheme();
            initFirebase(); // Start Firebase init
            
            // Event Listeners for editor
            htmlCode.addEventListener('input', () => {
                debouncedUpdate();
            });
            htmlCode.addEventListener('scroll', syncScroll);

            // Range Selector inputs synchronization
            const rStartSlider = document.getElementById('range-start-slider');
            const rEndSlider = document.getElementById('range-end-slider');
            const rStartVal = document.getElementById('range-start-val');
            const rEndVal = document.getElementById('range-end-val');
            
            function syncRangeInputs(changedId) {
                const totalLines = htmlCode.value.split('\n').length;
                let start = parseInt(rStartSlider.value) || 1;
                let end = parseInt(rEndSlider.value) || 1;
                
                if (changedId === 'start-slider') {
                    rStartVal.value = rStartSlider.value;
                    start = parseInt(rStartSlider.value);
                    if (start > end) {
                        rEndSlider.value = start;
                        rEndVal.value = start;
                    }
                } else if (changedId === 'start-val') {
                    let val = parseInt(rStartVal.value) || 1;
                    val = Math.max(1, Math.min(val, totalLines));
                    rStartVal.value = val;
                    rStartSlider.value = val;
                    start = val;
                    if (start > end) {
                        rEndSlider.value = start;
                        rEndVal.value = start;
                    }
                } else if (changedId === 'end-slider') {
                    rEndVal.value = rEndSlider.value;
                    end = parseInt(rEndSlider.value);
                    if (end < start) {
                        rStartSlider.value = end;
                        rStartVal.value = end;
                    }
                } else if (changedId === 'end-val') {
                    let val = parseInt(rEndVal.value) || 1;
                    val = Math.max(1, Math.min(val, totalLines));
                    rEndVal.value = val;
                    rEndSlider.value = val;
                    end = val;
                    if (end < start) {
                        rStartSlider.value = end;
                        rStartVal.value = end;
                    }
                }
                updateRangeStats();
            }
            
            if (rStartSlider) {
                rStartSlider.addEventListener('input', () => syncRangeInputs('start-slider'));
                rStartVal.addEventListener('input', () => syncRangeInputs('start-val'));
                rEndSlider.addEventListener('input', () => syncRangeInputs('end-slider'));
                rEndVal.addEventListener('input', () => syncRangeInputs('end-val'));
            }
        };
    </script>
</body>
